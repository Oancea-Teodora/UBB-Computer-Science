<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>jQuery Bar Chart</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

</head>

<body>
    <div class="input-container">
        <input type="text" id="numbers" placeholder="Enter comma-separated numbers (e.g., 25, 50, 10, 80, 45)" />
        <button id="generate">Generate Chart</button>
    </div>
    <div class="chart-container" id="chart"></div>

</body>

<style>
    body {
        font-family: sans-serif;
        padding: 20px;
    }

    #chartContainer {
        display: flex;
        align-items: flex-end;
        height: 300px;
        width: 80%;
        margin-top: 20px;
        padding: 10px;
        border: 1px solid #ccc;
        background-color: #f9f9f9;
        box-sizing: border-box;
        overflow: hidden;
    }

    .bar-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin: 0 5px;
        flex: 1;
        min-width: 20px;
    }

    .chart-bar {
        background-color: steelblue;
        width: 100%;
        height: 0;
        transition: height 0.8s ease-out;
        margin-top: 5px;
        order: -1;
    }

    .bar-label {
        font-size: 0.8em;
        color: #333;
        margin-top: 4px;
        text-align: center;
        white-space: nowrap;
    }

    button {
        margin-top: 15px;
        padding: 8px 15px;
        cursor: pointer;
    }

    input[type="text"] {
        padding: 8px;
        margin-left: 5px;
        min-width: 250px;
    }

    .chart-container {
        display: flex;
        align-items: flex-end;
        height: 400px;
        padding: 20px;
        gap: 20px;
        margin-top: 20px;
    }

    .bar {
        flex: 1;
        background-color: #89CFF0;
        transition: height 1s ease-in-out;
        min-width: 40px;
        text-align: center;
        color: white;
        font-weight: bold;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .negative_bar {
        flex: 1;
        background-color: #89CFF0;
        transition: height -1s ease-in-out;
        min-width: 40px;
        text-align: center;
        color: white;
        font-weight: bold;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .input-container {
        margin: 20px;
        text-align: center;
        color: #333
    }

    input {
        padding: 8px;
        width: 300px;
        margin-right: 10px;
    }

    button {
        padding: 8px 16px;
        background-color: #89CFF0;
        color: white;
        border: none;
        cursor: pointer;
    }

    button:hover {
        background-color: steelblue;
    }
</style>

<script>
    $(document).ready(function () {
        $('#generate').click(function () {
            // Clear previous chart
            $('#chart').empty();

            // Get input values
            const input = $('#numbers').val();
            const numbers = input.split(',').map(num => parseFloat(num.trim())).filter(num => !isNaN(num));

            if (numbers.length === 0) {
                alert('Please enter valid numbers separated by commas');
                return;
            }
            // Find maximum value for scaling
            const maxValue = Math.max(...numbers.map(Math.abs));  // Use absolute max value for scaling
            // Create bars
            numbers.forEach((num, index) => {

                let height;

                // Special handling for 0 values
                if (num === 0) {
                    height = 2;  // Small height for zero values
                } else if (num < 0) {
                    height = Math.abs((num / maxValue) * 100);
                } else {
                    height = (num / maxValue) * 100;  // Positive height scaling
                }

                // Create the bar element
                const bar = $('<div>')
                    .addClass('bar')
                    .css('height', '0')
                    .text(num);

                // Style bars differently based on value
                if (num < 0) {
                    bar.css({
                        'position': 'relative',
                        'background-color': 'red',
                        'border': '2px solid darkred',
                        'top': '0',
                        'bottom': '0',
                    });
                } else if (num === 0) {
                    bar.css({
                        'background-color': '#B0B0B0',  // Grey color for zero
                        'height': '2px'  // Explicitly set height for zero
                    });
                } else {
                    bar.css({
                        'background-color': '#89CFF0',
                        'border': '1px solid #ADD8E6'  // Light border for positive numbers
                    });
                }

                $('#chart').append(bar);
                console.log(height)
                // Animate the bar
                if (num > 0)
                    setTimeout(() => {
                        bar.css('height', height + '%');
                    }, 100);
                else
                    setTimeout(() => {
                        bar.css('bottom', height + '%')
                    }, 100);
            });
        });
    });
</script>

</html>
