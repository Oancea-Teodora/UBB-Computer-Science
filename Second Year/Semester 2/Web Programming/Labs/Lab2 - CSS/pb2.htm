<!DOCTYPE html>
<html>

<style>
    .menu {
        list-style: none;
        padding: 0;
        text-align: center;
    }

    .menu li {
        padding: 10px;
        margin: 5px;
        background-color: #ddd;
        filter: blur(5px);

    }

    .menu li:hover {
        transform: scale(1.2);
        filter: blur(0);
        color: blue;
    }
</style>


<body>
    <ul class="menu">
        <li>Home</li>
        <li>About</li>
        <li>More</li>
        <li>Music</li>
        <li>Contact</li>
</body>

</html>
